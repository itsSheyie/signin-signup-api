services:
  postgres:
    image: postgres:16
    container_name: signin-signup-postgres
    environment:
      POSTGRES_DB: signin_signup
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: signin-signup-redis
    ports:
      - "6379:6379"

volumes:
  pgdata: